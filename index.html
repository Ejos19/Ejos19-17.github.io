<!-- ==========================================================================
     PROYECTO: Tasa Oficial BCV + Historial (Banco Central de Venezuela)
     DESCRIPCIÓN: Estructura HTML para mostrar tasas oficiales USD / EUR y su historial.
     MODO: Archivo HTML independiente vinculado con style.css y script.js
     ========================================================================== -->

<!-- Declaración del tipo de documento HTML5 estándar -->
<!doctype html>

<!-- Apertura de la etiqueta html definiendo el idioma en español -->
<html lang="es">
  <!-- Cabecera del documento que contiene metadatos, fuentes y enlaces a estilos -->
  <head>
    <!-- icono ubicado en la pagina del proyecto -->
    <link href="Asset/icono oso2.png" rel="icon" sizes="200x200" />

    <!-- Codificación de caracteres en UTF-8 para admitir acentos, eñes y caracteres especiales -->
    <meta charset="UTF-8" />

    <!-- Configuración del viewport para garantizar una correcta visualización en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título de la pestaña en el navegador web -->
    <title>Tasa Oficial BCV + Historial</title>

    <!-- Vinculación con la hoja de estilos externa style.css -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <!-- Cuerpo principal de la página web donde se renderizan todos los elementos visibles -->
  <body>
    <!-- Contenedor principal de tipo tarjeta (card) centrado en pantalla -->
    <div class="card" id="bcv-card">
      <!-- Encabezado superior con fondo azul corporativo y textos descriptivos -->
      <div class="header" id="card-header">
        <!-- Contenedor del branding personal del autor (Logo y Firma) encima del título -->
        <div class="brand-container" id="brand-container">
          <!-- Imagen del logo (icono del oso) con ruta relativa y respaldo automático -->
          <img
            src="Assets/icono_oso3.png"
            alt="Logo Osoniki"
            class="brand-logo"
            id="brand-logo"
            onerror="
              this.onerror = null;
              this.src = 'icono_oso2.png';
            "
          />
          <!-- Imagen de la firma gráfica (Osiniki) con ruta relativa y respaldo automático -->
          <img
            src="Assets/icono oso2.png"
            alt="Firma Osiniki"
            class="brand-signature"
            id="brand-signature"
            onerror="
              this.onerror = null;
              this.src = 'osiniki4k.png';
            "
          />
        </div>
        <!-- Título institucional del Banco Central de Venezuela -->
        <h2>Banco Central de Venezuela</h2>
        <!-- Subtítulo que describe la naturaleza del contenido (tasas oficiales) -->
        <p>Tasas de Cambio Oficiales</p>
      </div>

      <!-- Contenido central de la tarjeta donde se muestran los valores y la fecha -->
      <div class="content" id="card-content">
        <!-- Contenedor flexible que alinea los recuadros de tasas USD y EUR lado a lado -->
        <div class="rates-container" id="rates-container">
          <!-- Recuadro para la cotización del Dólar Estadounidense (USD) -->
          <div class="currency-box" id="usd-box">
            <!-- Etiqueta del par cambiario USD / VES -->
            <div class="currency">USD / VES</div>
            <!-- Valor numérico dinámico de la tasa USD inyectado por script.js -->
            <div class="rate" id="usd-rate">--</div>
          </div>

          <!-- Separador vertical visual entre ambas monedas -->
          <div class="separator" id="rate-separator"></div>

          <!-- Recuadro para la cotización del Euro (EUR) -->
          <div class="currency-box" id="eur-box">
            <!-- Etiqueta del par cambiario EUR / VES -->
            <div class="currency">EUR / VES</div>
            <!-- Valor numérico dinámico de la tasa EUR inyectado por script.js -->
            <div class="rate" id="eur-rate">--</div>
          </div>
        </div>

        <!-- Etiqueta de texto donde se muestra la fecha y hora de última actualización del BCV -->
        <div class="date" id="bcv-date">Obteniendo datos...</div>
      </div>

      <!-- Contenedor de los botones de interacción para actualizar y desplegar historial -->
      <div class="actions" id="card-actions">
        <!-- Botón principal para forzar la consulta en tiempo real de las tasas actuales -->
        <button id="refresh-btn" class="primary-btn">Actualizar Tasas</button>
        <!-- Botón secundario para alternar la visibilidad del historial desplegable -->
        <button id="toggle-history-btn" class="secondary-btn">
          Ver Historial ▼
        </button>
      </div>

      <!-- Contenedor desplegable del Historial (oculto mediante la clase history-hidden) -->
      <div id="history-container" class="history-hidden">
        <!-- Tabla semántica del historial con estructura estándar reconocida por Power Query -->
        <table id="tabla-historial" class="history-table">
          <!-- Título accesible de la tabla para lectores de pantalla y asistentes de datos -->
          <caption class="history-thead">
            Historial de Cotizaciones Oficiales BCV
          </caption>
          <!-- Encabezado de columnas semánticas para mapeo automático en Power Query -->
          <thead class="history-thead">
            <tr>
              <!-- Columna de fecha del registro histórico -->
              <th scope="col">Fecha</th>
              <!-- Columna de tasa del Dólar estadounidense (USD) -->
              <th scope="col">USD</th>
              <!-- Columna de tasa del Euro (EUR) -->
              <th scope="col">EUR</th>
            </tr>
          </thead>
          <!-- Cuerpo de la tabla con registros pre-cargados para extracción inmediata por Power Query -->
          <tbody id="history-list" class="history-tbody">
            <!-- Fila del día más reciente con la cotización oficial -->
            <tr class="history-item">
              <td class="history-date">15/9/2026</td>
              <td class="history-usd">842.21</td>
              <td class="history-eur">977.88</td>
            </tr>
            <!-- Fila histórica del día previo registrado -->
            <tr class="history-item">
              <td class="history-date">12/9/2026</td>
              <td class="history-usd">842.21</td>
              <td class="history-eur">977.88</td>
            </tr>
            <!-- Fila histórica con cotización anterior del BCV -->
            <tr class="history-item">
              <td class="history-date">11/9/2026</td>
              <td class="history-usd">832.49</td>
              <td class="history-eur">968.07</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Vinculación con el archivo de lógica JavaScript script.js -->
    <script src="script.js"></script>
  </body>
</html>
